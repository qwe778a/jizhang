<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>记账</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
 background:#f5f6f8;color:#222
}
button,input{font:inherit}
.app{max-width:520px;margin:auto;padding-bottom:90px}
.page{display:none}.page.active{display:block}

.top{
 height:70px;background:#fff;display:flex;
 align-items:center;justify-content:center;
 font-size:21px;font-weight:700;position:relative
}
.back{
 position:absolute;left:18px;border:0;background:none;
 color:#2684ff;font-size:32px
}

.content{padding:16px}
.card{
 background:#fff;border-radius:20px;
 padding:20px;margin-bottom:16px
}
h2{margin:0 0 20px;font-size:21px}

.hero{
 background:linear-gradient(135deg,#181818,#303030);
 color:#fff;border-radius:22px;padding:26px 22px;
 margin-bottom:16px
}
.hero small{color:#aaa;font-size:15px}
.hero h1{font-size:36px;margin:12px 0}
.hero p{margin:0;color:#aaa}

.group{margin-bottom:18px}
label{display:block;margin-bottom:9px;font-size:15px}
input{
 width:100%;height:56px;border:1px solid #ddd;
 border-radius:13px;padding:0 14px;
 background:#fff;outline:none
}
input::placeholder{color:#bbb}

.save{
 width:100%;height:56px;border:0;
 border-radius:14px;background:#222;color:#fff;
 font-size:17px
}

/* 资金列表 */
.fund{
 padding:18px 0;border-bottom:1px solid #eee
}
.fund:last-child{border-bottom:0}
.fundTop{display:flex;align-items:center}
.number{
 width:36px;height:36px;border-radius:10px;
 background:#f1f2f4;display:flex;
 align-items:center;justify-content:center;
 font-weight:700;margin-right:12px
}
.info{flex:1}
.name{font-size:17px;font-weight:700}
.note{font-size:12px;color:#999;margin-top:5px}
.amount{text-align:right;font-size:18px;font-weight:700}
.percent{font-size:12px;color:#999;margin-top:4px}

.bar{
 height:6px;background:#eee;border-radius:10px;
 margin-top:13px;overflow:hidden
}
.bar span{
 height:100%;display:block;background:#222;
 border-radius:10px
}

.actions{
 display:flex;justify-content:flex-end;
 gap:8px;margin-top:12px
}
.smallBtn{
 border:0;border-radius:9px;
 padding:8px 12px;background:#f2f2f2;
 color:#333;font-size:13px
}
.blue{color:#2684ff}
.gray{color:#999}

.empty{
 text-align:center;color:#aaa;
 padding:30px 0
}

/* 组成页面 */
.summaryGrid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-bottom:16px
}
.summaryBox{
 background:#fff;border-radius:15px;
 padding:15px 10px;text-align:center
}
.summaryBox small{
 display:block;color:#999;font-size:12px;
 margin-bottom:7px
}
.summaryBox strong{font-size:15px}
.red{color:#ff3b4f}
.green{color:#25b96f}

.detail{
 padding:16px 0;border-bottom:1px solid #eee
}
.detail:last-child{border-bottom:0}
.detailTop{display:flex;align-items:flex-start}
.detailNo{
 width:36px;height:36px;border-radius:10px;
 background:#e8eef5;display:flex;
 align-items:center;justify-content:center;
 font-weight:700;margin-right:11px
}
.detailInfo{flex:1}
.detailName{font-weight:700}
.detailNote{font-size:12px;color:#999;margin-top:5px}
.detailMoney{font-size:17px;font-weight:700}

/* 底部 */
.bottom{
 position:fixed;bottom:0;left:50%;
 transform:translateX(-50%);
 width:100%;max-width:520px;height:72px;
 background:#fff;border-top:1px solid #eee;
 display:flex
}
.nav{
 flex:1;border:0;background:none;
 color:#888;font-size:12px
}
.nav b{display:block;font-size:22px;margin-bottom:3px}
.nav.active{color:#111}
.plus{
 width:45px;height:45px;border-radius:50%;
 background:#111;color:#fff;
 display:flex;align-items:center;
 justify-content:center;margin:auto;font-size:28px
}
</style>
</head>

<body>

<div class="app">

<!-- 资金主页 -->
<section id="fundPage" class="page active">

<div class="top">资金占比</div>

<div class="content">

<div class="hero">
<small>当前总资金</small>
<h1 id="totalMoney">¥0.00</h1>
<p id="fundCount">共 0 个资金项目</p>
</div>

<div class="card">

<h2 id="formTitle">添加资金</h2>

<div class="group">
<label>资金名称</label>
<input id="fundName"
 placeholder="例如：支付宝、微信、银行卡">
</div>

<div class="group">
<label>金额</label>
<input id="fundAmount"
 type="number"
 placeholder="请输入当前金额">
</div>

<div class="group">
<label>备注（选填）</label>
<input id="fundNote"
 placeholder="例如：货款、尾款">
</div>

<button class="save" onclick="saveFund()">
<span id="saveText">保存资金</span>
</button>

</div>

<div class="card">
<h2>资金明细</h2>
<div id="fundList"></div>
</div>

</div>
</section>


<!-- 资金组成页面 -->
<section id="detailPage" class="page">

<div class="top">
<button class="back" onclick="backFunds()">‹</button>
<span id="detailTitle">资金组成</span>
</div>

<div class="content">

<div class="hero">
<small>资金总额</small>
<h1 id="detailFundTotal">¥0.00</h1>
<p id="detailFundName"></p>
</div>

<div class="summaryGrid">

<div class="summaryBox">
<small>资金总额</small>
<strong id="sumTotal">¥0.00</strong>
</div>

<div class="summaryBox">
<small>已记录组成</small>
<strong id="sumUsed">¥0.00</strong>
</div>

<div class="summaryBox">
<small>未分配</small>
<strong id="sumRemain">¥0.00</strong>
</div>

</div>

<div class="card">

<h2 id="detailFormTitle">添加组成</h2>

<div class="group">
<label>编号</label>
<input id="detailNumber"
 placeholder="自动生成，也可以修改">
</div>

<div class="group">
<label>名称</label>
<input id="detailName"
 placeholder="请输入名称">
</div>

<div class="group">
<label>金额</label>
<input id="detailAmount"
 type="number"
 placeholder="请输入金额">
</div>

<div class="group">
<label>备注（选填）</label>
<input id="detailNote"
 placeholder="例如：货款、尾款">
</div>

<button class="save" onclick="saveDetail()">
<span id="detailSaveText">保存组成</span>
</button>

</div>

<div class="card">
<h2>组成明细</h2>
<div id="detailList"></div>
</div>

</div>
</section>


<div class="bottom">
<button class="nav">
<b>⌂</b>
首页
</button>

<button class="nav">
<div class="plus">+</div>
</button>

<button class="nav">
<b>▤</b>
账单
</button>

<button class="nav active" onclick="backFunds()">
<b>◉</b>
资金
</button>
</div>

</div>


<script>
const $=id=>document.getElementById(id);

const money=n=>
 "¥"+Number(n||0).toLocaleString("zh-CN",{
 minimumFractionDigits:2,
 maximumFractionDigits:2
 });

const esc=s=>
 String(s||"").replace(/[&<>"']/g,m=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#039;"
 })[m]);

let funds=
 JSON.parse(localStorage.getItem("jizhangFundsV2"))||[];

let editFundId=null;
let currentFundId=null;
let editDetailId=null;

function saveData(){
 localStorage.setItem(
 "jizhangFundsV2",
 JSON.stringify(funds)
 );
}


/* =====================
   资金
===================== */

function saveFund(){

 const name=$("fundName").value.trim();
 const amount=Number($("fundAmount").value);
 const note=$("fundNote").value.trim();

 if(!name)
  return alert("请输入资金名称");

 if(!Number.isFinite(amount)||amount<0)
  return alert("请输入正确金额");

 if(editFundId){

  const f=funds.find(x=>x.id===editFundId);

  if(f){
   f.name=name;
   f.amount=amount;
   f.note=note;
  }

 }else{

  funds.push({
   id:Date.now(),
   name,
   amount,
   note,
   details:[]
  });

 }

 saveData();
 clearFundForm();
 renderFunds();
}


function clearFundForm(){

 editFundId=null;

 $("fundName").value="";
 $("fundAmount").value="";
 $("fundNote").value="";

 $("formTitle").textContent="添加资金";
 $("saveText").textContent="保存资金";
}


function editFund(id){

 const f=funds.find(x=>x.id===id);
 if(!f)return;

 editFundId=id;

 $("fundName").value=f.name;
 $("fundAmount").value=f.amount;
 $("fundNote").value=f.note||"";

 $("formTitle").textContent="编辑资金";
 $("saveText").textContent="保存修改";

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });
}


function deleteFund(id){

 if(!confirm("确定删除这个资金项目吗？"))
  return;

 funds=funds.filter(x=>x.id!==id);

 saveData();
 renderFunds();
}


function renderFunds(){

 const total=
 funds.reduce((s,f)=>s+Number(f.amount||0),0);

 $("totalMoney").textContent=money(total);

 $("fundCount").textContent=
 `共 ${funds.length} 个资金项目`;

 const sorted=[...funds].sort(
 (a,b)=>b.amount-a.amount
 );

 $("fundList").innerHTML=
 sorted.length
 ?
 sorted.map((f,index)=>{

  const percent=
   total
   ?f.amount/total*100
   :0;

  const detailTotal=
   (f.details||[])
   .reduce((s,x)=>s+Number(x.amount||0),0);

  return `
  <div class="fund">

   <div class="fundTop">

    <div class="number">
     ${index+1}
    </div>

    <div class="info">

     <div class="name">
      ${esc(f.name)}
     </div>

     <div class="note">
      ${f.note?esc(f.note):"暂无备注"}
     </div>

    </div>

    <div class="amount">

     ${money(f.amount)}

     <div class="percent">
      ${percent.toFixed(2)}%
     </div>

    </div>

   </div>

   <div class="bar">
    <span style="width:${Math.min(percent,100)}%">
    </span>
   </div>

   <div class="actions">

    <button
     class="smallBtn"
     onclick="openDetails(${f.id})">
     资金组成
     ${(f.details||[]).length
      ?`(${f.details.length})`
      :""
     }
    </button>

    <button
     class="smallBtn blue"
     onclick="editFund(${f.id})">
     编辑
    </button>

    <button
     class="smallBtn gray"
     onclick="deleteFund(${f.id})">
     删除
    </button>

   </div>

  </div>
  `;

 }).join("")

 :

 `<div class="empty">
  还没有资金数据
 </div>`;
}


/* =====================
   打开资金组成
===================== */

function openDetails(id){

 currentFundId=id;
 editDetailId=null;

 const f=funds.find(x=>x.id===id);

 if(!f)return;

 $("fundPage").classList.remove("active");
 $("detailPage").classList.add("active");

 $("detailTitle").textContent=
 f.name+" · 资金组成";

 clearDetailForm();
 renderDetails();

 window.scrollTo(0,0);
}


function backFunds(){

 $("detailPage").classList.remove("active");
 $("fundPage").classList.add("active");

 currentFundId=null;

 renderFunds();
 window.scrollTo(0,0);
}


/* =====================
   自动编号
===================== */

function nextNumber(){

 const f=funds.find(
  x=>x.id===currentFundId
 );

 if(!f)return 1;

 const numbers=
  (f.details||[])
  .map(x=>parseInt(x.number))
  .filter(Number.isFinite);

 return numbers.length
 ?Math.max(...numbers)+1
 :1;
}


/* =====================
   添加组成
===================== */

function saveDetail(){

 const f=funds.find(
  x=>x.id===currentFundId
 );

 if(!f)return;

 const number=
  $("detailNumber").value.trim();

 const name=
  $("detailName").value.trim();

 const amount=
  Number($("detailAmount").value);

 const note=
  $("detailNote").value.trim();

 if(!number)
  return alert("请输入编号");

 if(!name)
  return alert("请输入名称");

 if(!Number.isFinite(amount)||amount<=0)
  return alert("请输入正确金额");

 if(editDetailId){

  const d=f.details.find(
   x=>x.id===editDetailId
  );

  if(d){
   d.number=number;
   d.name=name;
   d.amount=amount;
   d.note=note;
  }

 }else{

  f.details.push({
   id:Date.now(),
   number,
   name,
   amount,
   note
  });

 }

 saveData();
 clearDetailForm();
 renderDetails();
}


function clearDetailForm(){

 editDetailId=null;

 $("detailNumber").value=
 currentFundId
 ?nextNumber()
 :"";

 $("detailName").value="";
 $("detailAmount").value="";
 $("detailNote").value="";

 $("detailFormTitle").textContent=
 "添加组成";

 $("detailSaveText").textContent=
 "保存组成";
}


/* =====================
   编辑组成
===================== */

function editDetail(id){

 const f=funds.find(
  x=>x.id===currentFundId
 );

 if(!f)return;

 const d=f.details.find(
  x=>x.id===id
 );

 if(!d)return;

 editDetailId=id;

 $("detailNumber").value=d.number;
 $("detailName").value=d.name;
 $("detailAmount").value=d.amount;
 $("detailNote").value=d.note||"";

 $("detailFormTitle").textContent=
 "编辑组成";

 $("detailSaveText").textContent=
 "保存修改";

 window.scrollTo({
  top:300,
  behavior:"smooth"
 });
}


/* =====================
   删除组成
===================== */

function deleteDetail(id){

 const f=funds.find(
  x=>x.id===currentFundId
 );

 if(!f)return;

 if(!confirm("确定删除这条组成明细吗？"))
  return;

 f.details=
  f.details.filter(x=>x.id!==id);

 saveData();
 clearDetailForm();
 renderDetails();
}


/* =====================
   显示组成
===================== */

function renderDetails(){

 const f=funds.find(
  x=>x.id===currentFundId
 );

 if(!f)return;

 if(!Array.isArray(f.details))
  f.details=[];

 const used=
  f.details.reduce(
   (s,x)=>s+Number(x.amount||0),0
  );

 const remain=
  Number(f.amount)-used;

 $("detailFundTotal").textContent=
 money(f.amount);

 $("detailFundName").textContent=
 f.name;

 $("sumTotal").textContent=
 money(f.amount);

 $("sumUsed").textContent=
 money(used);

 $("sumRemain").textContent=
 money(remain);

 $("sumRemain").className=
 remain<0
 ?"red"
 :remain===0
 ?"green"
 :"";

 const sorted=
  [...f.details].sort((a,b)=>{

   const A=parseFloat(a.number);
   const B=parseFloat(b.number);

   if(Number.isFinite(A)&&Number.isFinite(B))
    return A-B;

   return String(a.number)
   .localeCompare(String(b.number));

  });

 $("detailList").innerHTML=
 sorted.length
 ?
 sorted.map(d=>`

 <div class="detail">

  <div class="detailTop">

   <div class="detailNo">
    ${esc(d.number)}
   </div>

   <div class="detailInfo">

    <div class="detailName">
     ${esc(d.name)}
    </div>

    <div class="detailNote">
     ${d.note
      ?esc(d.note)
      :"暂无备注"
     }
    </div>

   </div>

   <div class="detailMoney">
    ${money(d.amount)}
   </div>

  </div>

  <div class="actions">

   <button
    class="smallBtn blue"
    onclick="editDetail(${d.id})">
    编辑
   </button>

   <button
    class="smallBtn gray"
    onclick="deleteDetail(${d.id})">
    删除
   </button>

  </div>

 </div>

 `).join("")

 :

 `<div class="empty">
   暂无组成明细
  </div>`;
}


/* 初始化 */

funds= funds.map(f=>({
 ...f,
 details:Array.isArray(f.details)
 ?f.details
 :[]
}));

saveData();
renderFunds();

</script>

</body>
</html>
