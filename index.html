<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的账本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}.app{max-width:520px;margin:auto;padding-bottom:80px}.page{display:none}.page.on{display:block}header{height:65px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;position:relative}main{padding:15px}.card,.stat{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:#222;color:#fff;border-radius:20px;padding:22px;margin-bottom:14px}.hero h1{font-size:34px;margin:10px 0}.hero small,.hero p,.sub{color:#999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{margin:0}.stat b{display:block;font-size:20px;margin-top:7px}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px}input,select{width:100%;height:50px;border:1px solid #ddd;border-radius:12px;background:#fff;padding:0 12px}.btn{width:100%;height:52px;border:0;border-radius:12px;background:#222;color:#fff}.tabs,.search{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;height:48px;border:1px solid #ddd;border-radius:12px;background:#fff}.tabs .sel{background:#222;color:#fff}.search input{flex:1}.search select{width:100px}.row{padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.rowtop{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.name{font-weight:bold}.sub{font-size:12px;margin-top:5px}.money{font-weight:bold;text-align:right}.in,.danger{color:#f04455}.actions{text-align:right;margin-top:9px}.mini{border:0;background:#f1f1f1;border-radius:8px;padding:7px 10px;margin-left:5px}.blue{color:#1687e8}.pay{background:#222;color:#fff}.num{min-width:34px;height:34px;padding:0 7px;background:#eee;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:bold}.bar{height:5px;background:#eee;border-radius:5px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#222}.day{font-weight:bold;font-size:17px;margin:12px 0}.day span{float:right;color:#999;font-size:11px;font-weight:normal}.empty{text-align:center;color:#aaa;padding:25px}.badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:6px;margin-top:5px;background:#eee}.pending{background:#fff1d9;color:#d77d00}.paid{background:#e7f7ed;color:#15934b}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:68px;background:#fff;border-top:1px solid #eee;display:flex}.nav{flex:1;border:0;background:none;color:#888}.nav.on{color:#111}.nav b{display:block;font-size:19px}.plus{width:43px;height:43px;line-height:40px;margin:auto;border-radius:50%;background:#111;color:#fff;font-size:28px}.back{position:absolute;left:15px;border:0;background:none;font-size:30px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.summary div{background:#fff;border-radius:12px;padding:12px 5px;text-align:center}.summary small{display:block;color:#999;font-size:11px}.summary b{font-size:13px}.check{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px}.check div{display:flex;justify-content:space-between;padding:5px 0}.result{text-align:center!important;display:block!important;background:#f5f5f5;border-radius:10px;padding:10px!important;margin-top:8px;font-weight:bold}
</style>
</head>

<body>
<div class="app">

<section id="home" class="page on">
<header>我的账本</header><main>
<div class="hero"><small>本月结余</small><h1 id="balance">¥0.00</h1><p id="monthText"></p></div>
<div class="grid">
<div class="stat"><small>本月收入</small><b class="in" id="homeIn">¥0</b></div>
<div class="stat"><small>本月支出</small><b id="homeOut">¥0</b></div>
<div class="stat"><small>当前总资金</small><b id="homeFunds">¥0</b></div>
<div class="stat"><small>本月笔数</small><b id="homeCount">0</b></div>
</div>
<div class="card" style="margin-top:14px"><b>最近账单</b><div id="recent"></div></div>
</main>
</section>

<section id="add" class="page">
<header>记一笔</header><main><div class="card">
<div class="tabs"><button id="outBtn" class="sel" onclick="setType('out')">支出</button><button id="inBtn" onclick="setType('in')">收入</button></div>
<div class="field"><label>金额</label><input id="amount" type="number" inputmode="decimal" placeholder="请输入金额"></div>
<div class="field"><label>项目名称</label><input id="title" placeholder="请输入项目名称"></div>
<div class="field"><label>渠道</label><select id="channel" onchange="otherBox()"><option>微信</option><option>支付宝</option><option>银行卡</option><option>其他</option></select></div>
<div class="field" id="otherWrap" style="display:none"><label>其他渠道</label><input id="other" placeholder="请输入渠道"></div>
<div class="field"><label>日期</label><input id="date" type="date"></div>
<div class="field"><label>备注</label><input id="note" placeholder="选填"></div>
<button class="btn" id="billSave" onclick="saveBill()">保存账单</button>
</div></main>
</section>

<section id="bills" class="page">
<header>账单</header><main>
<div class="card">
<div class="field"><input id="month" type="month" onchange="renderBills()"></div>
<div class="search"><input id="search" placeholder="搜索项目、渠道、备注" oninput="renderBills()"><select id="filter" onchange="renderBills()"><option value="all">全部</option><option value="in">收入</option><option value="out">支出</option></select></div>
</div>
<div class="grid">
<div class="stat"><small>收入</small><b class="in" id="monthIn">¥0</b></div>
<div class="stat"><small>支出</small><b id="monthOut">¥0</b></div>
</div>
<div class="card" style="margin-top:14px"><div id="billList"></div></div>
</main>
</section>

<section id="funds" class="page">
<header>资金</header><main>
<div class="hero"><small>当前总资金</small><h1 id="fundTotal">¥0.00</h1><p id="fundCount"></p></div>
<div class="card">
<b id="fundFormTitle">添加资金</b><br><br>
<div class="field"><input id="fundName" placeholder="资金名称"></div>
<div class="field"><input id="fundAmount" type="number" inputmode="decimal" placeholder="金额"></div>
<div class="field"><input id="fundNote" placeholder="备注（选填）"></div>
<button class="btn" id="fundSave" onclick="saveFund()">保存资金</button>
</div>
<div class="card"><b>资金明细</b><div id="fundList"></div></div>
</main>
</section>

<section id="parts" class="page">
<header><button class="back" onclick="show('funds')">‹</button><span id="partTitle">资金组成</span></header>
<main>
<div class="hero"><small>当前资金</small><h1 id="partTotal">¥0</h1><p id="partFund"></p></div>
<div class="summary">
<div><small>资金</small><b id="sTotal">¥0</b></div>
<div><small>已组成</small><b id="sUsed">¥0</b></div>
<div><small>结余</small><b id="sLeft">¥0</b></div>
</div>
<div class="check">
<div><span>待支付</span><b class="danger" id="pendingTotal">¥0</b></div>
<div class="result" id="result">等待计算</div>
</div>
<div class="card">
<b id="partFormTitle">添加组成</b><br><br>
<div class="field"><input id="partNo" placeholder="编号"></div>
<div class="field"><select id="partType" onchange="partTypeChange()"><option value="goods">货款</option><option value="expense">支出</option></select></div>
<div class="field" id="statusWrap" style="display:none"><select id="payStatus"><option value="pending">待支付</option><option value="paid">已支付</option></select></div>
<div class="field"><input id="partName" placeholder="名称"></div>
<div class="field"><input id="partAmount" type="number" inputmode="decimal" placeholder="金额"></div>
<div class="field"><input id="partNote" placeholder="备注（选填）"></div>
<button class="btn" id="partSave" onclick="savePart()">保存组成</button>
</div>
<div class="card"><b>组成明细</b><div id="partList"></div></div>
</main>
</section>

<nav class="bottom">
<button class="nav on" data-p="home" onclick="show('home')"><b>⌂</b>首页</button>
<button class="nav" data-p="add" onclick="newBill()"><div class="plus">+</div></button>
<button class="nav" data-p="bills" onclick="show('bills')"><b>▤</b>账单</button>
<button class="nav" data-p="funds" onclick="show('funds')"><b>◉</b>资金</button>
</nav>
</div>

<script>
const $=id=>document.getElementById(id),M=n=>"¥"+Number(n||0).toFixed(2),today=()=>new Date().toLocaleDateString("en-CA");
let bills=JSON.parse(localStorage.getItem("myBills")||"[]"),funds=JSON.parse(localStorage.getItem("myFunds")||"[]");
let type="out",editBill=null,editFund=null,currentFund=null,editPart=null;
funds.forEach(f=>{f.parts=Array.isArray(f.parts)?f.parts:[];f.parts.forEach(p=>{p.partType=p.partType||"goods";p.status=p.status||(p.partType==="expense"?"pending":"goods")})});
const save=()=>{localStorage.setItem("myBills",JSON.stringify(bills));localStorage.setItem("myFunds",JSON.stringify(funds))};

function show(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");
 document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x.dataset.p===id));
 if(id==="home")renderHome();if(id==="bills")renderBills();if(id==="funds")renderFunds();if(id==="parts")renderParts();scrollTo(0,0)
}

function setType(t){type=t;$("outBtn").classList.toggle("sel",t==="out");$("inBtn").classList.toggle("sel",t==="in")}
function otherBox(){$("otherWrap").style.display=$("channel").value==="其他"?"block":"none"}

function newBill(){
 editBill=null;setType("out");["amount","title","note","other"].forEach(x=>$(x).value="");
 $("channel").value="微信";$("date").value=today();$("billSave").textContent="保存账单";otherBox();show("add")
}

function saveBill(){
 let amount=+$("amount").value,title=$("title").value.trim(),channel=$("channel").value==="其他"?$("other").value.trim():$("channel").value,date=$("date").value,note=$("note").value.trim();
 if(!(amount>0)||!title||!channel||!date)return alert("请填写完整");
 let old=bills.find(x=>x.id===editBill),b={id:editBill||Date.now(),type,amount,title,channel,date,note};
 if(old){b.autoFundPay=old.autoFundPay;b.fundId=old.fundId;b.partId=old.partId}
 editBill?bills=bills.map(x=>x.id===editBill?b:x):bills.push(b);save();editBill=null;show("bills")
}

function editB(id){
 let b=bills.find(x=>x.id===id);if(!b)return;editBill=id;setType(b.type);$("amount").value=b.amount;$("title").value=b.title;$("date").value=b.date;$("note").value=b.note||"";
 if(["微信","支付宝","银行卡"].includes(b.channel)){$("channel").value=b.channel;$("other").value=""}else{$("channel").value="其他";$("other").value=b.channel}
 otherBox();$("billSave").textContent="保存修改";show("add")
}
function delB(id){if(confirm("确定删除吗？")){bills=bills.filter(x=>x.id!==id);save();renderBills()}}

function billHTML(b){return `<div class="row"><div class="rowtop"><div class="grow"><div class="name">${b.title}</div><div class="sub">${b.channel} · ${b.note||"无备注"}</div>${b.autoFundPay?'<span class="badge paid">资金支付</span>':""}</div><div class="money ${b.type==="in"?"in":""}">${b.type==="in"?"+":"-"}${M(b.amount)}</div></div><div class="actions"><button class="mini blue" onclick="editB(${b.id})">编辑</button><button class="mini" onclick="delB(${b.id})">删除</button></div></div>`}

function renderBills(){
 let mo=$("month").value||today().slice(0,7),q=$("search").value.toLowerCase(),f=$("filter").value;$("month").value=mo;
 let d=bills.filter(x=>x.date?.startsWith(mo)&&(f==="all"||x.type===f)&&`${x.title}${x.channel}${x.note}`.toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 let sum=t=>d.filter(x=>x.type===t).reduce((s,x)=>s+Number(x.amount||0),0);$("monthIn").textContent="+"+M(sum("in"));$("monthOut").textContent="-"+M(sum("out"));
 let days=[...new Set(d.map(x=>x.date))];
 $("billList").innerHTML=days.length?days.map(day=>{let r=d.filter(x=>x.date===day),s=t=>r.filter(x=>x.type===t).reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="day">${day}<span>收入 ${M(s("in"))}　支出 ${M(s("out"))}</span></div>${r.map(billHTML).join("")}`}).join(""):'<div class="empty">暂无账单</div>'
}

function renderHome(){
 let mo=today().slice(0,7),d=bills.filter(x=>x.date?.startsWith(mo)),sum=t=>d.filter(x=>x.type===t).reduce((s,x)=>s+Number(x.amount||0),0),i=sum("in"),o=sum("out");
 $("balance").textContent=M(i-o);$("homeIn").textContent="+"+M(i);$("homeOut").textContent="-"+M(o);$("homeFunds").textContent=M(funds.reduce((s,x)=>s+Number(x.amount||0),0));$("homeCount").textContent=d.length;$("monthText").textContent=mo;
 $("recent").innerHTML=bills.length?[...bills].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5).map(billHTML).join(""):'<div class="empty">暂无账单</div>'
}

function saveFund(){
 let name=$("fundName").value.trim(),amount=+$("fundAmount").value,note=$("fundNote").value.trim();if(!name||amount<0)return alert("请输入正确内容");
 if(editFund){let f=funds.find(x=>x.id===editFund);Object.assign(f,{name,amount,note})}else funds.push({id:Date.now(),name,amount,note,parts:[]});
 save();clearFund();renderFunds()
}
function clearFund(){editFund=null;["fundName","fundAmount","fundNote"].forEach(x=>$(x).value="");$("fundFormTitle").textContent="添加资金";$("fundSave").textContent="保存资金"}
function editF(id){let f=funds.find(x=>x.id===id);editFund=id;$("fundName").value=f.name;$("fundAmount").value=f.amount;$("fundNote").value=f.note||"";$("fundFormTitle").textContent="编辑资金";$("fundSave").textContent="保存修改";scrollTo(0,180)}
function delF(id){if(confirm("确定删除该资金吗？")){funds=funds.filter(x=>x.id!==id);save();renderFunds()}}

function renderFunds(){
 let total=funds.reduce((s,x)=>s+Number(x.amount||0),0);$("fundTotal").textContent=M(total);$("fundCount").textContent=`共 ${funds.length} 个资金项目`;
 $("fundList").innerHTML=funds.length?[...funds].sort((a,b)=>b.amount-a.amount).map((f,i)=>{let pct=total?f.amount/total*100:0,p=(f.parts||[]).filter(x=>x.partType==="expense"&&x.status==="pending").reduce((s,x)=>s+Number(x.amount||0),0);return `<div class="row"><div class="rowtop"><div class="num">${i+1}</div><div class="grow"><div class="name">${f.name}</div><div class="sub">${f.note||"暂无备注"}</div>${p?`<span class="badge pending">待支付 ${M(p)}</span>`:""}</div><div class="money">${M(f.amount)}<div class="sub">${pct.toFixed(1)}%</div></div></div><div class="bar"><i style="width:${Math.min(pct,100)}%"></i></div><div class="actions"><button class="mini" onclick="openParts(${f.id})">资金组成</button><button class="mini blue" onclick="editF(${f.id})">编辑</button><button class="mini" onclick="delF(${f.id})">删除</button></div></div>`}).join(""):'<div class="empty">暂无资金</div>'
}

function openParts(id){currentFund=id;clearPart();show("parts")}
function partTypeChange(){$("statusWrap").style.display=$("partType").value==="expense"?"block":"none"}
function clearPart(){editPart=null;let f=funds.find(x=>x.id===currentFund),n=Math.max(0,...(f?.parts||[]).map(x=>parseInt(x.no)||0))+1;$("partNo").value=n;$("partType").value="goods";$("payStatus").value="pending";["partName","partAmount","partNote"].forEach(x=>$(x).value="");partTypeChange();$("partFormTitle").textContent="添加组成";$("partSave").textContent="保存组成"}

function savePart(){
 let f=funds.find(x=>x.id===currentFund),no=$("partNo").value,name=$("partName").value.trim(),amount=+$("partAmount").value,note=$("partNote").value.trim(),partType=$("partType").value,status=partType==="expense"?$("payStatus").value:"goods";
 if(!no||!name||!(amount>0))return alert("请填写完整");
 if(editPart){let p=f.parts.find(x=>x.id===editPart);if(p.autoPaid){partType="expense";status="paid"}Object.assign(p,{no,name,amount,note,partType,status})}
 else f.parts.push({id:Date.now(),no,name,amount,note,partType,status,autoPaid:false});
 save();clearPart();renderParts()
}

function editP(id){
 let p=funds.find(x=>x.id===currentFund)?.parts.find(x=>x.id===id);if(!p)return;editPart=id;$("partNo").value=p.no;$("partName").value=p.name;$("partAmount").value=p.amount;$("partNote").value=p.note||"";$("partType").value=p.partType;$("payStatus").value=p.status==="paid"?"paid":"pending";partTypeChange();$("partFormTitle").textContent="编辑组成";$("partSave").textContent="保存修改"
}
function delP(id){let f=funds.find(x=>x.id===currentFund);if(confirm("确定删除吗？")){f.parts=f.parts.filter(x=>x.id!==id);save();clearPart();renderParts()}}

function confirmPay(id){
 let f=funds.find(x=>x.id===currentFund),p=f?.parts.find(x=>x.id===id);if(!p||p.autoPaid)return;if(f.amount<p.amount)return alert("资金余额不足");if(!confirm(`确认支付 ${M(p.amount)}？`))return;
 f.amount-=p.amount;p.status="paid";p.autoPaid=true;p.paidDate=today();let bid=Date.now();p.billId=bid;bills.push({id:bid,type:"out",amount:+p.amount,title:p.name,channel:f.name,date:today(),note:p.note||"资金组成支出",autoFundPay:true,fundId:f.id,partId:p.id});save();renderParts()
}

function renderParts(){
 let f=funds.find(x=>x.id===currentFund);if(!f)return;
 let used=f.parts.filter(p=>p.partType!=="expense"||p.status==="paid").reduce((s,p)=>s+Number(p.amount||0),0),pending=f.parts.filter(p=>p.partType==="expense"&&p.status==="pending").reduce((s,p)=>s+Number(p.amount||0),0),left=Number(f.amount)-used;
 $("partTitle").textContent=f.name+"明细";$("partTotal").textContent=M(f.amount);$("partFund").textContent=f.name;$("sTotal").textContent=M(f.amount);$("sUsed").textContent=M(used);$("sLeft").textContent=M(left);$("pendingTotal").textContent=M(pending);$("result").textContent=Math.abs(left)<.005?"✓ 金额匹配":left>0?"尚有结余 "+M(left):"组成超出 "+M(-left);
 $("partList").innerHTML=f.parts.length?[...f.parts].sort((a,b)=>(parseFloat(a.no)||0)-(parseFloat(b.no)||0)).map(p=>{let wait=p.partType==="expense"&&p.status==="pending";return `<div class="row"><div class="rowtop"><div class="num">${p.no}</div><div class="grow"><div class="name">${p.name}</div><div class="sub">${p.note||"暂无备注"}</div><span class="badge ${wait?"pending":"paid"}">${p.partType==="goods"?"货款":wait?"支出 · 待支付":"支出 · 已支付"}</span></div><div class="money">${M(p.amount)}</div></div><div class="actions">${wait?`<button class="mini pay" onclick="confirmPay(${p.id})">确认支付</button>`:""}<button class="mini blue" onclick="editP(${p.id})">编辑</button><button class="mini" onclick="delP(${p.id})">删除</button></div></div>`}).join(""):'<div class="empty">暂无组成</div>'
}

$("date").value=today();
$("month").value=today().slice(0,7);
save();
renderHome();
</script>
</body>
</html>
